name: Indicadores económicos
on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar indicadores (mindicador.cl)
        run: |
          curl -sfL --retry 3 https://mindicador.cl/api -o tmp.json \
            || curl -sfL --retry 3 --ciphers 'DEFAULT:@SECLEVEL=1' https://mindicador.cl/api -o tmp.json \
            || curl -sfL --retry 3 http://mindicador.cl/api -o tmp.json \
            || curl -sfL --retry 3 https://www.mindicador.cl/api -o tmp.json
          python3 -c "import json;d=json.load(open('tmp.json'));k=['uf','dolar','euro','utm','ipc','libra_cobre'];o={x:{'valor':d[x]['valor'],'fecha':d[x]['fecha']} for x in k if x in d};assert o.get('uf');json.dump(o,open('indicadores.json','w'),indent=1)"
          rm tmp.json
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git diff --cached --quiet || (git commit -m "Indicadores $(date -u +%F' '%H:%M)" && git push)
