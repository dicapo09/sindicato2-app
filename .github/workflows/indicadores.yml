name: Indicadores económicos
on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar indicadores y metales
        run: python3 tools/indicadores.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git diff --cached --quiet || (git commit -m "Indicadores $(date -u +%F' '%H:%M)" && git pull --rebase -q && git push)
